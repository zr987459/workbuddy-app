name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.4
          name: "WorkBuddy App v1.1.4 (纯安卓独立版)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.1.4)

            - 🛡️ **彻底根除腾讯云 WAF 403 阻断 (WAF Block Page)**：
              - 将网关第一优先默认端点切换为官方 CLI/IDE 专属标准通道 `/v2/chat/completions`（彻底告别 `/console` 网页端对 `/proc/`、`netstat` 等 Linux 脚本命令的敏感 WAF 拦截）；
              - `/console` 仅在 404 等路由缺失时作为兜底；
              - 增强 WAF 拦截精准告警提示，杜绝整页 HTML 污染报错输出；
            - 🧠 **Hark 深度加固版思考模型闭环**：
              - 严格按 `$uid:$tool_call_id` 隔离缓存，只在最后一条真实 user 之后的活动工具轮次按需注入，历史长文本零膨胀；
              - 流式异常下发 `translator.abort(err)` 保证 thinking/text 完整安全闭合；
            - 🌐 **100% 腾讯官方 WorkBuddy 国际版真实模型与倍率**：
              - 0.00x Free 限免白嫖：`deepseek-v4.1-flash-1017`、`deepseek-v4.1-flash`、`hy4-preview` 国际版全部 0 积分免费！

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
