name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: "WorkBuddy App v1.1.2 (纯安卓独立版)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.1.2)

            - 🧠 **思考模型 (Thinking) 全生命周期闭环**：
              - 采用 Hark 架构方案：在 `convertAssistant` 中将历史 `thinking` 块忠实还原为 `reasoning_content`；
              - 网关内置 `reasoningCache` 自动感知与补齐机制：若客户端（Pi-Web / OpenAI 客户端）未回传历史 `reasoning_content`，网关自动按 `tool_call_id` 与 `conv_id` 自动从缓存补回，彻底终结 DeepSeek 多轮工具调用拒答；
              - 剔除无脑强制 `reasoning_effort=high`，客户端未显式要求时不盲目强开；
              - 流式输出中将 thinking 增量与 signature 独立开块（包含 start / thinking_delta / signature_delta / stop），不再与正文挤在 index 0 导致客户端混淆；
            - 🎯 **稳定的全局会话指纹 (X-Conversation-ID)**：
              - OpenAI 兼容模式下自动从 `messages[0]` 提取 system 提示词推导会话指纹；Linux 版与 Android 版 100% 算法对齐，多轮交互指纹稳定恒定；
            - 🛡️ **精细化上游异常捕获 (UpstreamException)**：
              - 拒绝盲目兜底跳端点掩盖真因，精确捕获上游错误码与片段，透传给客户端；
            - 🔌 **Socket 超时与挥手加固**：
              - 客户端连接统一采用 `client.use` 自动挥手关闭，避免客户端死等挂起；空闲读超时放宽至 120 秒，适应长上下文首字延迟；
            - 🌐 **100% 腾讯官方 WorkBuddy 国际版真实模型与倍率**：
              - 0.00x Free 限免白嫖：`deepseek-v4.1-flash-1017`、`deepseek-v4.1-flash`、`hy4-preview` 国际版全部 0 积分免费！

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
