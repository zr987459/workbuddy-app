name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "WorkBuddy App v1.2.0 (纯安卓独立版 · 后台常驻+统计+实时日志)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.2.0)

            - 🛡️ **后台常驻启动与开机守护**：
              - 接入 `BootReceiver`：支持系统开机 (`BOOT_COMPLETED`) 与应用更新覆盖 (`MY_PACKAGE_REPLACED`) 自动静默拉起网关前台服务；
              - 修复物理返回键退出隐患：主界面按返回键自动执行 `moveTaskToBack(true)` 退居后台守护，杜绝 Activity 意外关闭断连；
            - 📊 **首页指标实时准确统计**：
              - 落地轻量高性能 `GatewayMetrics` 持久化模块：实时统计当天「今日请求」与「今日 Token」消耗总数，按自然日自动重置并即时刷新；
            - 📜 **全新「运行日志」模块**：
              - 移动端底部胶囊导航栏新增第 5 个 Tab「日志」；
              - 实时可视化展示每笔 API 请求流水：请求时刻、协议路由、调用模型、耗时毫秒数、Token 消耗及错误告警；
              - 支持一键刷新与一键清空日志；
            - ⚡ **对齐成熟开源项目双端点回退与反探测脱敏**：
              - 11128 渠道拦截毫秒级自动回退至 `/console`；
              - 403 WAF 拦截自动回退至 `/v2`；
              - 出站自动脱敏 `11128` 为 `11-128`，消除敏感拦截词误触发。

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
