name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "WorkBuddy App v1.0.4 (纯安卓独立版)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.0.4)

            - 🛡️ **彻底根除中文 UTF-8 请求死锁卡死**：采用 Hark 架构方案，全连接统一使用 `BufferedInputStream` 按 RFC 规范精确字节流读满，杜绝字符与字节混淆导致的多字节中文死等超时！
            - ⚡ **SSE 架构全链路加固**：
              - 引入 `tcpNoDelay = true`，大幅减少流式小包延迟；
              - 严格按 UTF-8 字节计算 chunk 分块大小，每帧即时 `flush()`；
              - 增加 `ping` 保活事件，异常时优雅下发 `event: error`；
              - 无论正常完成或异常中断均确保输出 `0\r\n\r\n` 终止块，杜绝客户端挂起。
            - 🚫 **杜绝虚假回复**：同步请求 (`chatSync`) 严格透传上游真实状态码与错误信息，坚决不编造假响应。
            - ⏹ **新增对话控制**：支持「⏹ 停止生成」实时掐断流传输与「🧹 新对话」一键重置上下文。
            - 🔌 **通用 API 导出**：
              - 本地 OpenAI 接口：`http://127.0.0.1:8800/v1/chat/completions`
              - 本地 Anthropic 接口：`http://127.0.0.1:8800/v1/messages`

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
