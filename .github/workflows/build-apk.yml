name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.5
          name: "WorkBuddy App v1.1.5 (纯安卓独立版)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.1.5)

            - 🛡️ **对齐成熟开源项目 (workbuddy2api) 工业级双端点智能回退**：
              - 完美解决单端点故障问题：默认按 `[/v2/chat/completions, /console/chat/completions]` 智能候选序列派发；
              - 遇到上游 `11128 / 渠道校验` 自动毫秒级回退至 `/console` 保证普通对话（如「你好」）100% 畅通；
              - 遇到腾讯云 `403 WAF Block` 自动回退至 `/v2` 保证包含复杂 Linux 诊断脚本（`/proc/` 等）的长请求不被 WAF 阻断；
              - 出站请求体自动进行反探测脱敏：将历史及上下文中的裸数字 `11128` 改写为 `11-128`，消除上游反探测规则误触发；
              - 智能规范化首条消息角色（支持 `developer` 自动对齐为 `system`），保证上游首消息强校验 100% 通过；
            - 🧠 **Hark 深度加固版思考模型闭环**：
              - 严格按 `$uid:$tool_call_id` 隔离缓存，只在最后一条真实 user 之后的活动工具轮次按需注入，历史长文本零膨胀；
              - 流式异常下发 `translator.abort(err)` 保证 thinking/text 完整安全闭合；
            - 🌐 **100% 腾讯官方 WorkBuddy 国际版真实模型与倍率**：
              - 0.00x Free 限免白嫖：`deepseek-v4.1-flash-1017`、`deepseek-v4.1-flash`、`hy4-preview` 国际版全部 0 积分免费！

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
