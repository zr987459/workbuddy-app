name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "WorkBuddy App v1.0.8 (纯安卓独立版)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.0.8)

            - 🛡️ **彻底根除 11128 渠道校验拦截 (Illegal API invocation from an unapproved channel)**：
              - 注入官方客户端风控必备头：`X-CodeBuddy-Request: 1`、`X-Requested-With: XMLHttpRequest`、`Accept-Language: en-US`；
              - 首行流式智能感知与端点回退：若遇渠道校验拦截，0.1 秒内无感切换至官方端点重试，保证请求 100% 成功送达！
            - 🌐 **100% 对齐腾讯官方 WorkBuddy 国际版真实模型与倍率**：
              - **0.00x 限免免费白嫖**：`deepseek-v4.1-flash-1017`（最新多模态快照）、`deepseek-v4.1-flash`、`hy4-preview`（混元深度思考）、`hy3` 国际版全部 0 积分免费！
              - **国际版专属大模型**：`gpt-6-astra` (6.67x 顶级旗舰)、`gpt-5.6-sol`、`gpt-5.4` (原生多模态识图)、`grok-4.7`、`gemini-3.5-flash` 全量就绪；
              - 剔除所有捏造参数，严格按官方口径呈现真实模型与倍率。
            - 🧠 **深度思考与思维链 (Thinking) 全面激活**：
              - 自动透传 `reasoning_effort: high`，响应侧原生保留并分发 `reasoning_content` 与 Anthropic `thinking_delta`。
            - 🛠️ **完整支持工具调用 (Function / Tool Calling)**：
              - 采用黑名单透传机制，请求中的 `tools`、`tool_choice`、`parallel_tool_calls` 100% 完整送达上游。
            - 🔋 **后台常驻守护**：startForegroundService + START_STICKY + 按需 WakeLock，切后台或锁屏长请求永不断流。

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
