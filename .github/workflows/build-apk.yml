name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "WorkBuddy App v1.0.5 (纯安卓独立版)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.0.5)

            - 🖼️ **全面支持多模态图片识别 (OpenAI + Anthropic)**：
              - 彻底修复图片块被误当作纯字符串丢弃的问题；
              - OpenAI 协议原生支持 `image_url`（Base64 / URL）；
              - Anthropic 协议自动将 `type: image` 图片源解析并转换为标准多模态图片块下发上游，图片识别一触即发！
            - 🔋 **后台常驻与按需 WakeLock（锁屏/切后台不挂起）**：
              - 采用官方 `startForegroundService` + `START_STICKY` 自拉起守护；
              - 引入按需唤醒锁（请求期间自动 acquire 续期，空闲时自动 release 彻底省电），锁屏或退回桌面长输出绝不中断；
            - 🛡️ **对齐 Hark 架构**：精确字节流读满、TCP_NODELAY、实时 Flush 与双端点智能兜底。
            - 🔌 **通用 API 导出**：
              - 本地 OpenAI 接口：`http://127.0.0.1:8800/v1/chat/completions`
              - 本地 Anthropic 接口：`http://127.0.0.1:8800/v1/messages`

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
