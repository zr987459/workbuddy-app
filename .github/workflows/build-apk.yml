name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "WorkBuddy App v1.3.0 (纯安卓独立版 · 状态栏常驻通知+凭据导入导出)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.3.0)

            - 🔔 **Android 状态栏常驻通知与权限自动引导**：
              - 适配 Android 13+ (API 33+) 动态 `POST_NOTIFICATIONS` 运行时权限申请，彻底解决高版本 Android 状态栏图标被静默隐藏的问题；
              - 通知渠道提升为 `IMPORTANCE_DEFAULT`，常驻图标显示在系统顶部状态栏，下拉展示网关守护状态与一键点击直达面板；
            - 🔑 **账号凭据 (Token) 完备导入与导出**：
              - 账号页新增「📥 导入」与「📤 导出」双通道：
                - 支持粘贴单条/多条裸 JWT（以 `eyJ` 开头），自动 Base64 解析 `sub`、`nickname` 等字段入库；
                - 支持直接导入/导出完整备份 JSON（与 CookieBox、wb_manager 格式无缝互通）；
                - 账号卡片新增一键「删除」移除无用凭据；
            - 📜 **移动端第 5 个 Tab「运行日志」完备生效**：
              - 修复打包 assets 静态资源映射；
              - 真实记录每笔 API 调用请求时刻、协议路由、模型、状态码、Token 消耗量与耗时；
            - 📊 **首页指标实时准确统计**：
              - 落地轻量高性能 `GatewayMetrics` 持久化模块，按自然日自动清零，首页「今日请求」与「今日 Token」即时刷新。

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
