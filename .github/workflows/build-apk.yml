name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "WorkBuddy App v1.0.0 (纯安卓独立版)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.0.0)

            - 🚀 **100% 纯安卓原生直驱（真·单机独立运行）**：
              - 采用纯 Kotlin + OkHttp3 原生协议引擎，内置轻量嵌入式网关；
              - **彻底告别 Termux / PRoot / 外部 Python 二进制**，彻底规避 Android 10+ SELinux 无执行权限拦截！
              - 手机上点击桌面图标直接冷启动，毫秒级就绪，完全离线自洽！
            - 🎨 **重构移动端 UI**：
              - iOS / Material 3 浮动胶囊底栏（概览 · 账号 · 接入 · 对话）；
              - 全面精简国内碎包积分与红包任务，专注海外账号与大模型 API 调用。
            - 🌍 **国际版全自动一键授权**：
              - 点击「+ 授权新账号」自动调用官方 OAuth 设备授权流，浏览器确认后 2.5 秒自愈捕获入库！
            - 💬 **即时对话工作台**：
              - 原生移动端聊天界面，支持 DeepSeek V4.1、GLM 等模型实时流式打字机输出与折叠思维链抽屉！
            - 🔌 **通用 API 导出**：
              - 本地网关端口 `http://127.0.0.1:8792/v1`，可供手机上任意第三方软件（如 NextChat）免密直接调用！

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
