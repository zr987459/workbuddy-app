name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "WorkBuddy App v1.0.2 (纯安卓独立版)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.0.2)

            - 🚀 **全面支持 Anthropic Messages 协议**：支持 `/v1/messages` 接口与完整 SSE 流式转换，彻底解决第三方客户端（如 Antigravity / Claude 客户端）调用报错！
            - ⚡ **HTTP/1.1 分块传输编码 (Chunked Encoding)**：内置原生流式打字机采用标准分块流传输，彻底解决移动端对话卡在「思考中」无法吐字的问题！
            - 📂 **双向自动识别账号凭证**：自动联动扫描内部存储与 `auths/` 目录凭据，无论从何处授权入库均能即刻生效调用！
            - 📋 **官方授权链接复制**：支持一键复制官方登录链接，便于在任意浏览器中打开登录。
            - 🔌 **通用 API 导出**：
              - 本地 OpenAI 接口：`http://127.0.0.1:8792/v1/chat/completions`
              - 本地 Anthropic 接口：`http://127.0.0.1:8792/v1/messages`

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
