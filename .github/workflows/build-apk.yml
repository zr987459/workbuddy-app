name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "WorkBuddy App v1.0.3 (纯安卓独立版)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.0.3)

            - 🔌 **端口迁移至 8800**：默认监听端口更新为 `8800`，彻底杜绝与 Antigravity+ (8792) 的端口冲突！
            - 🚀 **全面支持 Anthropic Messages 双模**：
              - 非流式单次响应 (`stream: false`)：针对第三方客户端（如 Antigravity / Claude 客户端）的连接性测试进行完整 JSON 响应适配；
              - 流式分块传输 (`stream: true`)：严格对齐 Anthropic 官方规范下发 `message_start`, `content_block_delta`, `message_delta`（包含完整的 `usage` 字段），彻底杜绝客户端 undefined 崩溃。
            - 🛡️ **对齐腾讯官方指纹与双端点回退**：自动注入 `X-Conversation-ID`、`X-Machine-ID`、`X-Session-ID` 与用量归属头，并在 `/console` 与 `/v2` 端点间智能兜底，避开渠道校验拦截。
            - 纯净离线自洽：彻底清除旧版 7863 端口与外部依赖，纯 Kotlin 原生引擎独立运行。
            - 🔌 **通用 API 导出**：
              - 本地 OpenAI 接口：`http://127.0.0.1:8800/v1/chat/completions`
              - 本地 Anthropic 接口：`http://127.0.0.1:8800/v1/messages`

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
