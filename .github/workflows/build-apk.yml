name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyApp-APK
          path: dist/WorkBuddyApp.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.3
          name: "WorkBuddy App v1.1.3 (纯安卓独立版)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyApp.apk
          body: |
            ### 📱 WorkBuddy App (纯安卓独立版 v1.1.3)

            - 🧠 **Hark 深度加固版思考模型闭环**：
              - 彻底修复全局 `cId` 兜底导致历史 assistant 思考被同构覆盖与串号隐患：严格限制只按 `tool_call_id` 并隔离为 `uid:tool_id` 键位缓存；
              - 补齐约束：只对最后一条 `user` 之后的活动工具轮次按需注入 `reasoning_content`，杜绝历史长文本倍增与上下文膨胀；
              - 非流式 `chatSync` 完备同步写入 `recordReasoning`，流式与非流式工具调用闭环 100% 对齐；
            - 🛡️ **Anthropic 流式异常完备闭合 (abort)**：
              - 新增 `translator.abort(err)`：发生上游异常前强制先行关闭活动中尚未闭合的 `thinking` 块与 `text` 块，再下发标准规范 `{"type":"error","error":{...}}`，防止移动端客户端挂在半开的事件块上；
            - 🐧 **Linux 服务端与 Android 体验对齐**：
              - 非流式补全聚合完整收集并保留 `tool_calls` 与 `reasoning_content`，错误分支补发 `[DONE]` 终止帧；
              - 会话指纹生成算法与 Android 完全一致；
            - 🌐 **100% 腾讯官方 WorkBuddy 国际版真实模型与倍率**：
              - 0.00x Free 限免白嫖：`deepseek-v4.1-flash-1017`、`deepseek-v4.1-flash`、`hy4-preview` 国际版全部 0 积分免费！

            *点击下方 Assets 里的 `WorkBuddyApp.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
